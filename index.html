<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바이브코딩 실습실</title>
<style>

:root {
  --primary:#8ea9d1;
  --bg:#f8f8fc;
  --text:#27334b;
  --muted:#758093;
  --border:#e5e8f2;
  --card:#fff}
* {
  box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;
  line-height:1.55}
button,input,select,textarea {
  font:inherit}
button {
  cursor:pointer}
button:disabled {
  opacity:.55;
  cursor:wait}
a {
  color:#496ca5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid #9abce9;
  outline-offset:2px}
.shell {
  width:85%;
  max-width:1440px;
  margin:auto}
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:22px 0}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:20px}
.mark {
  display:grid;
  place-items:center;
  background:#e5ebfb;
  width:44px;
  height:44px;
  border-radius:15px}
.actions {
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap}
.btn {
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  padding:10px 14px;
  color:var(--text);
  font-weight:650;
  min-height:42px}
.btn.primary {
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)}
.btn.soft {
  background:#f0f4ff}
.btn.danger {
  color:#b84c58}
.btn.small {
  padding:6px 10px;
  min-height:34px;
  font-size:13px}
.hero {
  padding:32px;
  background:linear-gradient(115deg,#e9edfc,#eaf7ef,#fff1e7);
  border-radius:26px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center}
.hero h1 {
  font-size:clamp(25px,3vw,41px);
  line-height:1.35;
  margin:8px 0}
.eyebrow {
  color:#566c9e;
  font-size:12px;
  letter-spacing:2px;
  font-weight:800}
.muted {
  color:var(--muted)}
.hero p {
  margin:0}
.heroIcon {
  font-size:76px}
.toolbar {
  display:flex;
  gap:10px;
  align-items:center;
  margin:24px 0 16px;
  flex-wrap:wrap}
.input,.select,.textarea {
  border:1px solid #dae0ec;
  border-radius:12px;
  padding:10px 12px;
  background:#fff;
  color:var(--text);
  width:100%;
  min-height:43px}
.search {
  max-width:360px;
  flex:1;
  min-width:200px}
.chips {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px}
.chip {
  border-radius:100px;
  padding:8px 14px;
  background:#fff;
  border:1px solid var(--border)}
.chip.active {
  background:#dfe8fa;
  border-color:#b9cbea;
  font-weight:700}
.cards {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
  padding-bottom:50px}
.card {
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--card);
  padding:22px;
  box-shadow:0 8px 24px #3c4e7b0a;
  transition:transform .18s}
.card:hover {
  transform:translateY(-2px)}
.card .emoji {
  font-size:34px}
.card h3 {
  font-size:20px;
  margin:12px 0 4px}
.card p {
  min-height:46px;
  margin:8px 0}
.tags {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:12px 0}
.tag {
  font-size:12px;
  color:#5f6e85;
  background:#f1f4fa;
  border-radius:8px;
  padding:4px 8px}
.cardBottom {
  display:flex;
  justify-content:space-between;
  align-items:center}
.panel {
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  margin-bottom:18px}
.back {
  margin:20px 0}
.detailHead {
  display:flex;
  gap:18px;
  align-items:start}
.detailHead .emoji {
  font-size:52px}
.detailHead h2 {
  font-size:30px;
  margin:0}
.tabs {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:20px 0 16px}
.tab {
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  padding:10px 14px}
.tab.active {
  background:#e6edf9;
  border-color:#a5b8dc;
  font-weight:800}
.contentbox {
  padding:20px;
  border:1px solid var(--border);
  background:#fafbff;
  border-radius:15px;
  margin-bottom:15px}
.contentbox h3 {
  margin:0 0 10px}
.pre {
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.8;
  margin:12px 0;
  font-size:14px}
.code {
  background:#172237;
  color:#eaf0fc;
  padding:18px;
  border-radius:12px;
  overflow:auto;
  white-space:pre;
  tab-size:2;
  max-height:520px;
  font:13px/1.6 Consolas,monospace}
.row {
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap}
.empty {
  text-align:center;
  padding:60px 20px;
  color:var(--muted)}
.foot {
  text-align:center;
  color:var(--muted);
  padding:28px;
  font-size:13px}
.overlay {
  position:fixed;
  inset:0;
  background:#151c31a3;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:30}
.modal {
  background:#fff;
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:21px;
  box-shadow:0 24px 80px #0004;
  padding:24px}
.modalHead {
  position:sticky;
  top:-24px;
  background:#fff;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 0 12px;
  border-bottom:1px solid var(--border);
  margin-bottom:17px}
.modal h2 {
  margin:0;
  font-size:23px}
.grid2 {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px}
.field {
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px}
.field input,.field select,.field textarea {
  margin-top:5px;
  font-weight:400}
.field textarea {
  min-height:115px;
  resize:vertical}
.adminTabs {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:16px}
.listrow {
  border-bottom:1px solid var(--border);
  padding:12px 2px;
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center}
.listrow:last-child {
  border:0}
.progress {
  height:9px;
  background:#e7edf4;
  border-radius:99px;
  overflow:hidden}
.progress>div {
  height:100%;
  background:#86c2ab;
  transition:width .2s}
.checkline {
  display:flex;
  gap:11px;
  align-items:center}
.checkline input {
  width:20px;
  height:20px;
  accent-color:#6ba98d}
.toast {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#263450;
  color:#fff;
  padding:12px 20px;
  border-radius:14px;
  z-index:90;
  max-width:90vw;
  box-shadow:0 8px 25px #0003}
.hidden {
  display:none!important}
.loading {
  text-align:center;
  padding:70px 20px}
.gallery-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.gallery-card {
  border:1px solid var(--border);
  background:#fff;
  border-radius:18px;
  padding:19px;
}
.gallery-card h3 { margin:0 0 9px; }
.gallery-card p { white-space:pre-wrap; word-break:break-word; }
@media(max-width:650px) {
  .gallery-grid { grid-template-columns:1fr; }
}
.spacer {
  flex:1}
@media(max-width:900px) {
  .shell {
  width:100%;
  padding:0 16px}
.cards {
  grid-template-columns:repeat(2,minmax(0,1fr))}
.heroIcon {
  font-size:45px}
}
@media(max-width:600px) {
  .cards {
  grid-template-columns:1fr}
.hero {
  padding:22px}
.heroIcon {
  display:none}
.top {
  align-items:flex-start}
.brand {
  font-size:16px}
.grid2 {
  grid-template-columns:1fr}
.modal {
  padding:17px}
.modalHead {
  top:-17px}
.detailHead h2 {
  font-size:24px}
.panel {
  padding:16px}
.tabs {
  gap:4px}
.tab {
  padding:8px 11px;
  font-size:13px}
}
 
.diagram{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:24px 10px;background:linear-gradient(110deg,#f1f4ff,#edfaf2);border-radius:20px}.diagram span{background:#fff;border:1px solid #dce4f2;border-radius:16px;padding:18px 14px;text-align:center;font-weight:700;min-width:125px}.diagram b{color:#7893c2}.diagram small{font-weight:400;color:#6b7585}

/* 관리자 화면에서 바로 편집 */
.inline-edit { display:inline-flex; align-items:center; justify-content:center;
  margin-left:8px; padding:6px 9px; border-radius:10px; border:1px solid #cbd5e6;
  background:#f3f6ff; color:#405f93; font-size:13px; cursor:pointer; }
.inline-edit:hover { background:#e1ebff; }
.inline-tools { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:10px 0; }
.inline-heading { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.inline-add { border:1px dashed #a5b9d5; background:#f4f8ff; border-radius:12px;
  padding:10px 14px; cursor:pointer; font-weight:600; }
.edit-indicator { background:#eaf7ef; border:1px solid #b5ddc3; color:#276844;
  border-radius:999px; padding:6px 12px; font-size:12px; }
.guide-link { color:#3566aa; text-decoration:underline; overflow-wrap:anywhere; font-weight:600; }
.guide-link:hover { color:#203f71; }
</style></head>
<body>

<div class="shell"><header class="top"><div class="brand"><span class="mark">✨</span><span id="brandName">바이브코딩 실습실</span></div><div class="actions"><button class="btn small" id="homeBtn" onclick="goHome()">🏠 홈</button><button class="btn small" onclick="showSubmitApp()">✉️ 작품 제출</button><button class="btn small" onclick="showGallery()">🎨 작품 갤러리</button><button class="btn small" onclick="reloadPublic()">↻ 새로고침</button><button class="btn small" id="adminBtn" aria-label="관리자 설정" title="관리자 설정" onclick="showLogin()">⚙</button></div></header>
<main id="root"><div class="loading">실습 자료를 불러오는 중…</div></main>
<footer class="foot" id="footer">AI와 함께 만드는 나만의 앱</footer>
</div><div id="layer" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('\"', '&quot;').replaceAll(String.fromCharCode(39), '&#39;');
const truth = v => String(v).toLowerCase() === 'true';
const num = v => Number(v) || 0;
const DEFAULT_UPLOAD_FOLDER = 'https://drive.google.com/drive/folders/15rkaAuFlABYKpudod0bwezEEUTMjYu6e?usp=sharing';
let PUB = null, ADM = null, token = '', selected = '', tab = 'guides', filter = 'all', query = '', adminSection = 'Examples', busy = false, modalRestore = null;
const schema = { Categories: ['categoryId', 'name', 'description', 'icon', 'color', 'sortOrder', 'isActive'], Examples: ['exampleId', 'categoryId', 'title', 'subtitle', 'description', 'difficulty', 'estimatedMinutes', 'technology', 'icon', 'thumbnailUrl', 'sortOrder', 'isPublished', 'createdAt', 'updatedAt'], Prompts: ['promptId', 'exampleId', 'title', 'promptType', 'content', 'sortOrder', 'isActive'], SourceCodes: ['codeId', 'exampleId', 'fileName', 'language', 'content', 'description', 'sortOrder', 'isActive'], Missions: ['missionId', 'exampleId', 'title', 'description', 'difficulty', 'prompt', 'hint', 'sortOrder', 'isActive'], Guides: ['guideId', 'exampleId', 'stepNumber', 'title', 'content', 'isActive'], Resources: ['resourceId', 'exampleId', 'title', 'resourceType', 'url', 'description', 'sortOrder', 'isActive'] };
const labels = { Categories: '카테고리', Examples: '실습 예제', Prompts: '프롬프트', SourceCodes: '소스코드', Missions: '개선 미션', Guides: '실습 안내', Resources: '참고 자료' };
const fieldLabels = { categoryId: '카테고리', exampleId: '연결 예제', title: '제목', name: '이름', subtitle: '부제목', description: '설명', difficulty: '난이도', estimatedMinutes: '예상 시간(분)', technology: '사용 기술', icon: '이모지', thumbnailUrl: '썸네일 URL', sortOrder: '정렬 순서', isActive: '공개 여부', isPublished: '공개 여부', promptType: '프롬프트 유형', content: '내용 / 코드', fileName: '파일명', language: '언어', stepNumber: '단계 순서', prompt: '미션 프롬프트', hint: '힌트', resourceType: '자료 유형', url: '링크 주소', color: '표시 색상', createdAt: '생성일', updatedAt: '수정일' };
function call(fn, ...args) { return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e.message || String(e))))[fn](...args)); }
function flash(s) { const el = $('#toast'); el.textContent = s; el.classList.remove('hidden'); clearTimeout(flash.timer); flash.timer = setTimeout(() => el.classList.add('hidden'), 3000); }
function fail(e) { flash('⚠ ' + e.message); console.error(e); }
function setBusy(v) { busy = v; document.querySelectorAll('button[data-submit]').forEach(b => b.disabled = v); }
async function reloadPublic() { try {
    if (!PUB)
        $('#root').innerHTML = '<div class="loading">실습 자료를 불러오는 중…</div>';
    PUB = await call('getPublicData');
    applyTheme();
    render();
    flash('자료를 업데이트했습니다.');
}
catch (e) {
    $('#root').innerHTML = '<div class="empty">자료를 불러오지 못했습니다. 다시 시도해 주세요.</div>';
    fail(e);
} }
function applyTheme() { const s = PUB.settings; document.title = s.appName || '바이브코딩 실습실'; $('#brandName').textContent = s.appName || '바이브코딩 실습실'; $('#footer').textContent = s.footerText || 'AI와 함께 만드는 나만의 앱'; document.documentElement.style.setProperty('--primary', new RegExp('^#[0-9a-f]{6}$', 'i').test(s.primaryColor) ? s.primaryColor : '#8ea9d1'); document.documentElement.style.setProperty('--bg', new RegExp('^#[0-9a-f]{6}$', 'i').test(s.backgroundColor) ? s.backgroundColor : '#f8f8fc'); let style = $('#dynamicWidth'); if (!style) {
    style = document.createElement('style');
    style.id = 'dynamicWidth';
    document.head.appendChild(style);
} style.textContent = '@media(min-width:901px){.shell{width:' + Math.max(50, Math.min(100, num(s.desktopWidth) || 85)) + '%}}'; }
function uploadFolderUrl() {
    const value = String(PUB?.settings?.driveFolderUrl || DEFAULT_UPLOAD_FOLDER).trim();
    return /^https:\/\/drive\.google\.com\/drive\/folders\/[a-zA-Z0-9_-]+(?:\?.*)?$/.test(value)
        ? value
        : DEFAULT_UPLOAD_FOLDER;
}


function showSubmitApp(mode = 'file') {
    const currentExample = PUB && PUB.examples.find(
        example => String(example.exampleId) === String(selected)
    );
    const exampleLabel = currentExample ? currentExample.title : '';

    modal('📤 실행 결과 제출', `
      <p class="muted">만든 앱을 <strong>파일로 첨부</strong>하거나 <strong>실행 링크로 제출</strong>할 수 있습니다. 제출 후 작품 갤러리에 바로 공개됩니다.</p>
      <div class="row" style="margin:12px 0" role="group" aria-label="제출 방식">
        <button type="button" class="btn small" id="chooseFile" onclick="changeSubmitMode('file')">📎 파일 첨부</button>
        <button type="button" class="btn small" id="chooseLink" onclick="changeSubmitMode('link')">🔗 실행 링크</button>
      </div>
      <form id="submissionForm" onsubmit="submitLearnerApp(event)">
        <label class="field">제작자 이름 또는 닉네임
          <input class="input" name="authorName" maxlength="70" required placeholder="예: 율포초 김선생">
        </label>
        <label class="field">앱 이름
          <input class="input" name="appName" maxlength="120" required value="${esc(exampleLabel ? exampleLabel + ' - 나만의 앱' : '')}" placeholder="예: 우리 반 발표 순서 뽑기">
        </label>
        <label class="field">앱을 만든 이유
          <textarea class="textarea" name="reason" maxlength="1500" required placeholder="이 앱이 필요했던 이유를 간단히 적어 주세요."></textarea>
        </label>
        <label class="field">앱 작동 방식
          <textarea class="textarea" name="howItWorks" maxlength="2000" required placeholder="어떤 버튼을 누르면 무엇이 나타나는지 설명해 주세요."></textarea>
        </label>
        <div id="submissionModeFields"></div>
        <div id="submissionStatus" class="muted" aria-live="polite"></div>
        <div class="row">
          <button class="btn" type="button" onclick="closeModal()">취소</button>
          <button class="btn primary" type="submit" data-submit>작품 제출하기</button>
        </div>
      </form>
    `);
    changeSubmitMode(mode);
}

function changeSubmitMode(mode) {
    const form = $('#submissionForm');
    if (!form || busy) return;

    const isFile = mode === 'file';
    form.dataset.mode = isFile ? 'file' : 'link';
    $('#chooseFile').classList.toggle('soft', isFile);
    $('#chooseLink').classList.toggle('soft', !isFile);

    $('#submissionModeFields').innerHTML = isFile ? `
      <label class="field">📎 완성한 파일 선택 (7MB 이하)
        <input class="input" name="attachment" type="file" required
          accept=".html,.htm,.zip,.txt,.pdf,.js,.css,.json">
        <small class="muted">HTML, ZIP, PDF 등 파일을 선택한 후 ‘작품 제출하기’를 누르세요. 지정된 Google Drive 폴더에 자동 저장됩니다.</small>
      </label>
    ` : `
      <label class="field">🔗 완성한 앱의 실행 주소
        <input class="input" name="appUrl" type="url" maxlength="1500" required
          placeholder="https://script.google.com/macros/s/.../exec">
        <small class="muted">앱이 실제로 실행되는 주소를 붙여넣어 주세요. GAS는 ‘배포 → 배포 관리 → 웹 앱 URL 복사’에서 찾을 수 있습니다. GitHub Pages 주소도 가능합니다. 주소는 https://로 시작해야 합니다.</small>
      </label>
    `;
    $('#submissionStatus').textContent = '';
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const result = String(reader.result || '');
            resolve(result.slice(result.indexOf(',') + 1));
        };
        reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
        reader.readAsDataURL(file);
    });
}

async function submitLearnerApp(event) {
    event.preventDefault();
    if (busy) return;
    const form = event.currentTarget;
    const data = Object.fromEntries(new FormData(form).entries());
    const fileMode = form.dataset.mode === 'file';
    const status = $('#submissionStatus');
    setBusy(true);
    try {
        let result;
        if (fileMode) {
            const file = form.elements.attachment.files[0];
            if (!file) throw new Error('업로드할 파일을 선택하세요.');
            if (file.size > 7 * 1024 * 1024) throw new Error('7MB 이하의 파일만 업로드할 수 있습니다.');
            status.textContent = '파일을 전송하는 중… 완료될 때까지 기다려 주세요.';
            data.fileName = file.name;
            data.mimeType = file.type || 'application/octet-stream';
            data.base64 = await fileToBase64(file);
            delete data.attachment;
            result = await call('uploadLearnerFile', data);
        } else {
            result = await call('submitApp', data);
        }
        closeModal();
        flash(result.message || '제출되었습니다.');
    } catch (error) {
        status.textContent = '제출 실패: ' + error.message;
        fail(error);
    } finally {
        setBusy(false);
    }
}

async function showGallery() {
    selected = '';
    $('#root').innerHTML = '<div class="loading">제출 작품을 불러오는 중…</div>';
    try {

    modal('관리자 비밀번호 변경', `
    <form id="changePasswordForm" onsubmit="submitChangePassword(event)">
      <label class="field">
        현재 비밀번호
        <input class="input" id="currentPassword" type="password"
               autocomplete="current-password" required>
      </label>
      <label class="field">
        새 비밀번호 (6자 이상)
        <input class="input" id="newPassword" type="password"
               autocomplete="new-password" minlength="6" required>
      </label>
      <label class="field">
        새 비밀번호 확인
        <input class="input" id="confirmPassword" type="password"
               autocomplete="new-password" minlength="6" required>
      </label>
      <div class="row">
        <button type="button" class="btn" onclick="drawAdmin()">취소</button>
        <button data-submit type="submit" class="btn primary">비밀번호 변경</button>
      </div>
    </form>
    <p class="muted">변경 후 기존 관리자 로그인은 종료됩니다.</p>
  `);
}
async function submitChangePassword(event) {
    event.preventDefault();
    if (busy)
        return;
    const current = $('#currentPassword').value;
    const next = $('#newPassword').value;
    const confirm = $('#confirmPassword').value;
    if (next !== confirm) {
        flash('⚠ 새 비밀번호가 서로 일치하지 않습니다.');
        return;
    }
    setBusy(true);
    try {
        await call('changeAdminPassword', token, current, next);
        token = '';
        ADM = null;
        closeModal();
        flash('비밀번호가 변경되었습니다. 다시 로그인해 주세요.');
    }
    catch (error) {
        fail(error);
    }
    finally {
        setBusy(false);
    }
}
function adminTab(k) { adminSection = k; drawAdmin(); }
function drawAdminList() { const el = $('#adminContent'); if (adminSection === 'Submissions') {
    drawSubmissionAdmin();
    return;
} if (adminSection === 'Settings') {
    el.innerHTML = `<p class="muted">앱 이름 및 화면 표시 설정을 수정합니다.</p><div class="grid2">${ADM.settings.filter(x => ['appName', 'appSubtitle', 'appDescription', 'welcomeMessage', 'organization', 'instructor', 'logoUrl', 'footerText', 'primaryColor', 'secondaryColor', 'backgroundColor', 'accentColor', 'fontFamily', 'desktopWidth', 'showDifficulty', 'showEstimatedTime', 'showSourceCode', 'showMissions', 'showPreview', 'showAiLinks', 'enableProgress', 'enableSearch', 'maintenanceMode', 'driveFolderUrl'].includes(x.key)).map(x => `<label class="field">${esc(x.key)}<input class="input" data-setting="${esc(x.key)}" value="${esc(x.value)}"><small class="muted">${esc(x.description)}</small></label>`).join('')}</div><button class="btn primary" data-submit onclick="saveAppSettings()">설정 저장</button>`;
    return;
} const rows = ADM[adminSection] || []; const idField = schema[adminSection][0]; el.innerHTML = `<div class="row"><strong>${labels[adminSection]} · ${rows.length}건</strong><button class="btn primary small" onclick="editRecord(-1)">＋ 새 항목</button></div><div>${rows.map((r, i) => `<div class="listrow"><div><strong>${esc(r.title || r.name || r.fileName || r[idField])}</strong><div class="muted" style="font-size:12px">${esc(r[idField])} · ${esc(r.exampleId || r.categoryId || '')}${('isPublished' in r || 'isActive' in r) ? ' · ' + (truth(r.isPublished ?? r.isActive) ? '공개' : '비공개') : ''}</div></div><div class="actions"><button class="btn small" onclick="editRecord(${i})" aria-label="수정">✏️</button><button class="btn small danger" onclick="confirmRemove(${i})" aria-label="삭제">🗑️</button></div></div>`).join('') || '<div class="empty">등록된 자료가 없습니다.</div>'}</div>`; }
function drawSubmissionAdmin() {
    const root = $('#adminContent');
    const rows = ADM.Submissions || [];
    root.innerHTML = `
      <div class="row">
        <strong>제출된 작품 · ${rows.length}건</strong>
        <span class="muted">제출 즉시 갤러리에 공개됩니다. 필요하면 삭제할 수 있습니다.</span>
      </div>
      ${rows.map((work, index) => `
        <div class="gallery-card" style="margin:12px 0">
          <div class="row">
            <strong>${esc(work.appName)} · ${esc(work.authorName)}</strong>
          </div>
          <div class="muted" style="font-size:12px">${esc(work.createdAt)}</div>
          <p><strong>제작 이유</strong> ${esc(work.reason)}</p>
          <p><strong>작동 방식</strong> ${esc(work.howItWorks)}</p>
          <a href="${esc(work.appUrl)}" target="_blank" rel="noopener noreferrer">제출 결과 열기 ↗</a>
          <div class="actions" style="margin-top:12px">
            <button class="btn small danger" onclick="confirmDeleteSubmission(${index})">삭제</button>
          </div>
        </div>
      `).join('') || '<div class="empty">제출된 작품이 없습니다.</div>'}
    `;
}
function confirmDeleteSubmission(index) {
    const work = ADM.Submissions[index];
    modal('제출 작품 삭제', `
    <p><strong>${esc(work.appName)}</strong> 작품을 삭제하시겠습니까?</p>
    <p class="muted">삭제한 작품은 복구할 수 없습니다.</p>
    <div class="row">
      <button class="btn" onclick="drawAdmin()">취소</button>
      <button class="btn danger" data-submit onclick="removeSubmission('${esc(work.submissionId)}')">삭제</button>
    </div>
  `);
}
async function removeSubmission(id) {
    if (busy)
        return;
    busy = true;
    try {
        await call('deleteSubmission', token, id);
        ADM = await call('getAdminData', token);
        drawAdmin();
        flash('삭제했습니다.');
    }
    catch (error) {
        fail(error);
    }
    finally {
        busy = false;
    }
}
function editRecord(index) { const name = adminSection, fields = schema[name], row = index < 0 ? {} : ADM[name][index]; const pk = fields[0]; const inner = `<form id="editForm" onsubmit="submitRecord(event)"><div class="grid2">${fields.slice(1).filter(k => !['createdAt', 'updatedAt'].includes(k)).map(k => fieldHtml(k, row[k] ?? '', name)).join('')}</div><div class="row"><button class="btn" type="button" onclick="drawAdmin()">취소</button><button data-submit class="btn primary" type="submit">저장하기</button></div></form>`; modal((index < 0 ? '새 항목 추가' : '수정') + ' · ' + labels[name], inner); $('#editForm').dataset.section = name; $('#editForm').dataset.pk = pk; $('#editForm').dataset.id = row[pk] || ''; }
function fieldHtml(k, value, name) { const label = fieldLabels[k] || k; let input = ''; if (k === 'exampleId' || k === 'categoryId') {
    const rows = k === 'exampleId' ? ADM.Examples : ADM.Categories;
    const pk = k;
    input = `<select class="select" name="${k}" required><option value="">선택하세요</option>${rows.map(r => `<option value="${esc(r[pk])}" ${String(value) === String(r[pk]) ? 'selected' : ''}>${esc(r.title || r.name)} (${esc(r[pk])})</option>`).join('')}</select>`;
}
else if (k === 'isActive' || k === 'isPublished') {
    input = `<select class="select" name="${k}"><option value="TRUE" ${truth(value) || value === '' ? 'selected' : ''}>공개 / 사용</option><option value="FALSE" ${!truth(value) && value !== '' ? 'selected' : ''}>비공개 / 사용 안 함</option></select>`;
}
else if (['content', 'prompt', 'hint', 'description'].includes(k)) {
    input = `<textarea class="textarea" name="${k}" rows="${k === 'content' || k === 'prompt' ? 11 : 4}">${esc(value)}</textarea>`;
}
else if (['sortOrder', 'stepNumber', 'estimatedMinutes'].includes(k)) {
    input = `<input class="input" type="number" min="0" name="${k}" value="${esc(value || 0)}">`;
}
else {
    input = `<input class="input" name="${k}" value="${esc(value)}" ${k === 'title' || k === 'name' ? 'required' : ''}>`;
} return `<label class="field" style="${['content', 'prompt'].includes(k) ? 'grid-column:1/-1' : ''}">${esc(label)}${input}</label>`; }
async function submitRecord(ev) { ev.preventDefault(); if (busy)
    return; const form = ev.target, obj = Object.fromEntries(new FormData(form).entries()); if (form.dataset.id)
    obj[form.dataset.pk] = form.dataset.id; setBusy(true); try {
    await call('saveRecord', token, form.dataset.section, obj);
    ADM = await call('getAdminData', token);
    drawAdmin();
    flash('저장했습니다.');
    await silentRefresh();
}
catch (e) {
    fail(e);
}
finally {
    setBusy(false);
} }
function confirmRemove(i) { const name = adminSection, row = ADM[name][i], pk = schema[name][0]; modal('삭제 확인', `<p><strong>${esc(row.title || row.name || row.fileName || row[pk])}</strong> 항목을 삭제할까요?</p><p class="muted">삭제한 자료는 되돌릴 수 없습니다. 연결된 하위 자료가 있는 예제는 먼저 하위 자료를 삭제해야 합니다.</p><div class="row"><button class="btn" onclick="drawAdmin()">취소</button><button data-submit class="btn danger" onclick="removeRecord('${name}','${esc(row[pk])}')">삭제</button></div>`); }
async function removeRecord(name, id) { if (busy)
    return; setBusy(true); try {
    await call('deleteRecord', token, name, id);
    ADM = await call('getAdminData', token);
    drawAdmin();
    await silentRefresh();
    flash('삭제했습니다.');
}
catch (e) {
    fail(e);
}
finally {
    setBusy(false);
} }
async function saveAppSettings() { if (busy)
    return; const obj = {}; document.querySelectorAll('[data-setting]').forEach(e => obj[e.dataset.setting] = e.value); setBusy(true); try {
    await call('saveSettings', token, obj);
    ADM = await call('getAdminData', token);
    await silentRefresh();
    drawAdmin();
    flash('설정이 반영되었습니다.');
}
catch (e) {
    fail(e);
}
finally {
    setBusy(false);
} }
async function silentRefresh() { try {
    PUB = await call('getPublicData');
    applyTheme();
    render();
}
catch (e) {
    fail(e);
} }
async function refreshAdmin() { await openAdmin(); flash('관리 목록을 새로 고쳤습니다.'); }
async function adminLogoutAction() { try {
    await call('adminLogout', token);
}
catch (e) { } token = ''; ADM = null; $('#adminBtn').textContent = '⚙'; closeModal(); flash('로그아웃했습니다.'); }
reloadPublic();
